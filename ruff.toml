# The gate's Python lint and format law (owner, 2026-11-02; design note s1-1a-gate-design.md §5).
# Run only as: ruff ... --ignore-noqa --no-cache --config ruff.toml  (inline `# noqa` never waives a rule).
# The only waivers are the per-file-ignores below; this file is coordinator-owned law data.

target-version = "py315"
line-length = 120

[per-file-target-version]
"gate/bootstrap.py" = "py39"
"gate/toolchain/install.py" = "py312"
"gate/toolchain/manifest.py" = "py312"
"gate/run.py" = "py312"
"gate/runner/pyshim.py" = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "TID", "BLE", "S602", "S604", "S605"]

[lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "wait for a state through gate/wait.py, never for time (testing.md rule 1)"
"os.system".msg = "use subprocess with an argv list"
"os.wait".msg = "never reap children behind subprocess's back (it turns a failure into exit 0)"
"os.wait3".msg = "never reap children behind subprocess's back (it turns a failure into exit 0)"
"os.wait4".msg = "never reap children behind subprocess's back (it turns a failure into exit 0)"
"shutil.move".msg = "use os.rename: atomic, and never nests into an existing directory"
"signal.SIG_IGN".msg = "never ignore a signal: an ignored SIGCHLD reports a failed child as exit 0"

[lint.per-file-ignores]
"gate/wait.py" = ["TID251"]                              # the one wait helper may sleep (testing.md rule 1)
"gate/runner/tests/test_sigchld.py" = ["TID251"]         # sets SIG_IGN on purpose to prove the false-green fix
"gate/scaffold.py" = ["BLE001"]                          # main's catch-all → exit 2
"gate/run.py" = ["BLE001"]                               # main's catch-all → exit 2
"gate/runner/main.py" = ["BLE001"]                       # main's catch-all → exit 2
"gate/bootstrap.py" = ["BLE001"]                         # main's catch-all → exit 2
"gate/toolchain/install.py" = ["BLE001"]                 # main's catch-all → exit 2
