# Generated from gate/registry.json by make ci-workflow. Do not edit: the ci-fresh row checks it.
name: gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CGO_ENABLED: '0'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - run: python3 -I -B gate/bootstrap.py exec -- --tier T4 --job lint --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --run-dir .gate/ci/lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: records-lint-${{ github.run_attempt }}
          path: .gate/ci/lint/
          if-no-files-found: ignore
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 52
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - run: python3 -I -B gate/bootstrap.py exec -- --tier T4 --job test --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --run-dir .gate/ci/test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: records-test-${{ github.run_attempt }}
          path: .gate/ci/test/
          if-no-files-found: ignore
  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - run: python3 -I -B gate/bootstrap.py exec -- --tier T4 --job proofs --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --run-dir .gate/ci/proofs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: records-proofs-${{ github.run_attempt }}
          path: .gate/ci/proofs/
          if-no-files-found: ignore
  strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, proofs]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: records-*
          path: .gate/artifacts
      - if: always()
        run: python3 -I -B gate/bootstrap.py exec -- summarize --registry gate/registry.json --tier T4 --artifacts .gate/artifacts --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --attempt ${{ github.run_attempt }} --image "$ImageOS $ImageVersion"
