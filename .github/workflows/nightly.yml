# Generated from gate/registry.json by make ci-workflow. Do not edit: the ci-fresh row checks it.
name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CGO_ENABLED: '0'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'gate/proofs/go.mod', 'gate/proofs/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'gate/proofs/go.mod', 'gate/proofs/go.sum') }}-
      - run: make setup tools
      - run: go mod download all
      - run: go mod download all
        working-directory: gate/proofs
      - run: git checkout -- go.sum gate/proofs/go.sum
      - run: make vulndb
        continue-on-error: true
      - run: python3 -I -B gate/bootstrap.py exec -- --tier nightly --job lint --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --run-dir .gate/ci/lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: records-lint-${{ github.run_attempt }}
          path: .gate/ci/lint/
          if-no-files-found: ignore
