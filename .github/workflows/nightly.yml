# Generated from gate/registry.json by make ci-workflow. Do not edit: the ci-fresh row checks it.
name: nightly
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CGO_ENABLED: '0'
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - run: python3 -I -B gate/bootstrap.py exec -- --tier nightly --job nightly --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --run-dir .gate/ci/nightly
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: records-nightly-${{ github.run_attempt }}
          path: .gate/ci/nightly/
          if-no-files-found: ignore
  strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [nightly]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/vorsar/cep/tools
          key: tools-${{ runner.os }}-${{ hashFiles('tools.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
      - run: make setup tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: records-*
          path: .gate/artifacts
      - if: always()
        run: python3 -I -B gate/bootstrap.py exec -- summarize --registry gate/registry.json --tier nightly --artifacts .gate/artifacts --run-id ${{ github.run_id }}-${{ github.run_attempt }} --commit ${{ github.sha }} --attempt ${{ github.run_attempt }} --image "$ImageOS $ImageVersion"
